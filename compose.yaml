services:
  database:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: onboard
      POSTGRES_DB: onboardmeplease
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboard -d onboardmeplease"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://onboard@database:5432/onboardmeplease?sslmode=disable
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      APP_CAPTURE_TIMEOUT: ${APP_CAPTURE_TIMEOUT:-2h}
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "/app/onboardmeplease", "doctor"]
      interval: 15s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  postgres_data:
  app_data:
